<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(#ffe4ef 0%, #fff6fa 45%, #fbfbfa 100%); color: #172033;
    font-family: "Rounded Mplus 1c", sans-serif; overflow: hidden; }
  .icon { width: 150px; height: 150px; border-radius: 34px; box-shadow: 0 14px 30px rgba(220, 90, 140, .25); }
  h1 { margin: 22px 0 6px; font-size: 38px; font-weight: 900; color: #ff5f8f; letter-spacing: .02em;
    text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(255, 95, 143, .25); }
  .copy { margin: 0; font-size: 16px; font-weight: 700; color: #6b5560; }
  .store { margin-top: 22px; padding: 10px 24px; border-radius: 999px; background: #172033; color: #fff;
    font: 700 16px "Inter", "Rounded Mplus 1c", sans-serif; letter-spacing: .02em; }
  .maker { position: absolute; bottom: 70px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .mark { width: 46px; height: 46px; border-radius: 11px; background: #eef0ff; color: #4668e9;
    font: bold 32px/46px Georgia, "DejaVu Serif", serif; text-align: center; }
  .brand { font: 800 24px "Inter", sans-serif; letter-spacing: .1em; }
  .brand span { color: #4668e9; font-weight: 500; }
</style></head>
<body>
  <img class="icon" src="../../assets-src/icon-1024.png" alt="">
  <h1 id="t">ねこだるまおとし</h1>
  <p class="copy" id="c">ねこを落とさず、ぜんぶぬけるかな？</p>
  <div class="store" id="s">App Store で配信中</div>
  <div class="maker"><div class="mark">K</div><div class="brand">KAZE <span>Application</span></div></div>
<script>
  if (/lang=en/.test(location.search)) {
    t.textContent = 'Daruma Cat'; c.textContent = 'Knock them all out without dropping the cat!';
    s.textContent = 'Available on the App Store';
  }
</script>
</body></html>
